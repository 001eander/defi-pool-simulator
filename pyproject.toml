[project]
name = "defi-pool-simulator"
version = "0.1.0"
description = "DeFi 流动性池离散事件仿真（决策仿真课程实践案例）"
readme = "README.md"
authors = [
    { name = "Tang Tao", email = "2024111155@stu.sufe.edu.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "greenlet>=3.5.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "salabim>=26.0.8",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
docs = [
    "pypdf>=6.1.1",
    "python-docx>=1.2.0",
]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "salabim"
ignore_missing_imports = true
